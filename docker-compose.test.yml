# Disposable stack for the Playwright suite: its own database, its own ports and
# its own project name, so it can never read or write the development stack
# (5435/8001/3101) or the test database the pytest fixture uses (5434).
#
# Driven by `scripts/e2e.sh`, which brings it up, waits for real readiness and
# always tears it down with `down -v`. Do not point this file at a database that
# matters: the script deletes its volume on exit.

name: school-portal-v3-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school_portal_e2e
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d school_portal_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No named volume: the container's writable layer is the database, and
    # `down -v` plus `--force-recreate` guarantees an empty schema each run.

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      # Development environment on purpose: the browser suite signs in with the
      # documented demo accounts, which production deliberately refuses to seed.
      ENVIRONMENT: development
      DEBUG: "false"
      DATABASE_URL: postgresql://portal:portal@postgres:5432/school_portal_e2e
      SECRET_KEY: e2e-only-secret-key-not-used-anywhere-else
      CORS_ORIGINS: '["http://localhost:3002","http://127.0.0.1:3002"]'
      SEED_DEMO_DATA: "true"
      # The throwaway stack keeps its own predictable credential, independent of
      # whatever the development or presentation stack seeds: the specs sign in
      # with E2E_PASSWORD, which scripts/e2e.sh forwards.
      DEMO_PASSWORD: password123
      PASSWORD_RESET_DELIVERY: dev
      MALWARE_SCANNER: dev-clean
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: var/storage
      ACTIVATION_LINK_BASE: http://localhost:3002
      ACTIVATION_RETURN_LINK: "true"
      # The admission gates are off by default everywhere else — they are rolled
      # out deliberately. This disposable stack opts in explicitly, because its
      # specs exercise the workflows those gates protect: onboarding into a
      # mapped offering (a write), intake-date corrections and the migration
      # verification console.
      ADMISSIONS_WRITE_ENABLED: "true"
      ADMISSION_CORRECTIONS_ENABLED: "true"
      ADMISSION_CHANGE_REQUESTS_ENABLED: "true"
      ADMISSION_DATE_CORRECTION_ENABLED: "true"
      ADMISSION_MIGRATION_CONSOLE_ENABLED: "true"
      LOG_LEVEL: warning
    ports:
      - "8002:8001"
    depends_on:
      postgres:
        condition: service_healthy
    # A throwaway stack may migrate on start; production never does.
    command:
      - sh
      - -c
      - |
        python -m alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: production
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8001
      NEXT_PUBLIC_API_URL: http://localhost:8002
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/en/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
