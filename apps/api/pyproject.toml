[build-system]
# Editable installs need explicit package discovery: the project root also
# holds `alembic/` and `tests/`, so setuptools' flat-layout heuristic refuses
# to guess. Docker and CI both install with `pip install -e ".[dev]"`.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "school-portal-api"
version = "0.1.0"
description = "School Portal API - International Student Management"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
# S3-compatible private object storage (AWS S3, Cloudflare R2, MinIO, ...).
s3 = [
    "boto3>=1.34.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Alembic revision files are generated scaffolding (see `alembic revision
# --autogenerate`) and carry their own un-normalised import/`sa.Column`
# patterns. They are excluded so `ruff check .` and the documented
# `ruff check app/` gate agree on the same file set; migrations are instead
# verified for correctness by `alembic check` and the migration tests.
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
